# =============================================================================
# Nightly Live Tests
# =============================================================================
# Runs the testthat suite with all live-API gates flipped on so external
# upstream changes (WoRMS, FishBase, SeaLifeBase, OBIS, EcoBase) get caught
# before they cascade into broken deploys. Today's EcoBase HTTPS migration is
# the worked example: the offline fixture suite was 0-fail, but live tests
# would have flagged the redirect on day one.
#
# These tests are network-dependent and slower than the offline suite, so they
# don't run on every push — only nightly on a cron and on manual trigger.
#
# Security: no event data is interpolated into commands; every step is a
# pinned action or a literal command.
# =============================================================================

name: Nightly live tests

on:
  schedule:
    # 06:30 UTC daily. Not 04:00: from 2026-09-28 the ICES GeoServer WFS
    # answered HTTP 400 at 04:00 UTC on three nights running, while the same
    # request from this runner returned 200 in the daytime (see the probe
    # step below), so 04:00 looks like an ICES maintenance window.
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live-tests:
    name: tests/testthat (RUN_LIVE_TESTS=true)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_LIVE_TESTS: "true"
      ECONETOOL_TEST_OBIS_LIVE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev

      # Same as ci.yml testthat-offline: a new CRAN duckdb without a P3M
      # binary compiles for over 45 minutes. Install the binary from a dated
      # snapshot; setup-r-dependencies keeps it (upgrade: false).
      - name: Install duckdb binary from a P3M snapshot
        run: |
          Rscript -e 'install.packages("duckdb", repos = sprintf("https://p3m.dev/cran/__linux__/%s/2026-09-28", system("lsb_release -cs", intern = TRUE)))'
          Rscript -e 'cat("duckdb", as.character(packageVersion("duckdb")), "\n")'

      # Diagnostic only: since 2026-09-28 the ICES WFS answers this runner with
      # HTTP 400 while it answers other hosts with 200. Print what it returns,
      # with curl's and R's user agents, so a failing live test can be triaged.
      - name: Probe ICES WFS (diagnostic)
        continue-on-error: true
        run: |
          url='https://gis.ices.dk/geoserver/ows?service=WFS&version=2.0.0&request=GetFeature&typeNames=ices_eg:ICES_AREAS_VISA_SIMPLE_5KM&outputFormat=application/json'
          curl -s -o /tmp/ices_curl -w 'curl UA: HTTP %{http_code} %{size_download}B\n' --max-time 120 "$url" || true
          head -c 1000 /tmp/ices_curl; echo
          Rscript -e 'cat("R UA:", getOption("HTTPUserAgent"), "\n")'
          curl -s -o /tmp/ices_r -A "$(Rscript -e 'cat(getOption("HTTPUserAgent"))')" \
            -w 'R UA: HTTP %{http_code} %{size_download}B\n' --max-time 120 "$url" || true
          head -c 1000 /tmp/ices_r; echo

      # Must stay a superset of the testthat-offline job's list in ci.yml
      # (guarded by tests/testthat/test-ci-workflows.R): this job runs the
      # same test_dir() plus the live tests.
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::data.table
            any::worrms
            any::rfishbase
            any::httr
            any::jsonlite
            any::igraph
            any::dplyr
            any::tidyr
            any::readr
            any::readxl
            any::RCurl
            any::XML
            any::plyr
            any::ape
            any::icesVocab
            any::icesDatras
            any::randomForest
            any::DBI
            any::RSQLite
            any::digest
            any::openssl
            any::shiny
            any::withr
            any::yaml
            any::sf
            any::visNetwork
            any::fluxweb
            any::R6
            any::MASS
            any::leaflet
            any::DT
            any::bs4Dash
            any::shinyWidgets
            any::shinyBS
            any::future
            any::future.apply
            any::plotly
            any::processx
            any::htmltools
            any::writexl
            any::SHARK4R

      - name: Run live testthat suite (fail on any test failure)
        run: |
          testthat::test_dir(
            "tests/testthat",
            reporter = "summary",
            stop_on_failure = TRUE
          )
        shell: Rscript {0}
